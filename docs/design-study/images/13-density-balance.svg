<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Whitespace needs tension, not emptiness</title>
  <desc id="desc">A sparse hero card with a large unexplained void is contrasted with a compact hero followed by a clearly paced next section.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Whitespace needs tension, not emptiness</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Space should separate or focus; unexplained voids feel unfinished.</text>
  
    <text x="80" y="160" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">DEAD SPACE</text>
    <rect x="80" y="195" width="470" height="390" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/><text x="115" y="245" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="720" text-anchor="start">Hero content</text><rect x="115" y="278" width="300" height="8" rx="4" fill="#52606d"/><rect x="115" y="300" width="260" height="8" rx="4" fill="#52606d"/><rect x="115" y="345" width="155" height="48" rx="7" fill="#9c4221" stroke="none" stroke-width="2"/><text x="192" y="376" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="720" text-anchor="middle">Action</text><text x="315" y="530" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="middle">Unexplained void</text>
    <text x="650" y="160" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">PURPOSEFUL RHYTHM</text>
    <rect x="650" y="195" width="470" height="190" rx="16" fill="#e8eef5" stroke="none" stroke-width="2"/><text x="685" y="245" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="720" text-anchor="start">Hero content</text><rect x="685" y="278" width="300" height="8" rx="4" fill="#52606d"/><rect x="685" y="300" width="260" height="8" rx="4" fill="#52606d"/><rect x="685" y="325" width="155" height="48" rx="7" fill="#9c4221" stroke="none" stroke-width="2"/><text x="762" y="356" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="720" text-anchor="middle">Action</text>
    <line x1="650" y1="425" x2="1120" y2="425" stroke="#bcccdc" stroke-width="1"/><text x="650" y="478" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="740" text-anchor="start">Experience</text><rect x="650" y="510" width="350" height="8" rx="4" fill="#52606d"/><rect x="650" y="532" width="310" height="8" rx="4" fill="#52606d"/>
    <text x="650" y="585" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="560" text-anchor="start">The next section enters before attention dissipates.</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 13-DENSITY-BALANCE</text>
</svg>