<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Typography is layout</title>
  <desc id="desc">A wide tightly spaced paragraph is contrasted with a narrower paragraph using open line height and a controlled measure.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Typography is layout</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Measure, line height, weight, and baseline determine reading comfort and hierarchy.</text>
  
    <text x="80" y="160" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">TOO WIDE / TOO TIGHT</text>
    <rect x="80" y="190" width="1040" height="145" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/>
    <text x="110" y="235" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">A long line forces the eye to travel far and makes the next line harder to locate.</text>
    <text x="110" y="266" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Tight leading turns multiple lines into a dense texture instead of readable prose.</text>
    <text x="80" y="395" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">CONTROLLED MEASURE / OPEN LEADING</text>
    <rect x="80" y="425" width="650" height="175" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/>
    <text x="115" y="475" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">A controlled line length gives the eye</text>
    <text x="115" y="513" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">a reliable return path. Generous leading</text>
    <text x="115" y="551" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">keeps each line distinct without drifting apart.</text>
    <line x1="780" y1="445" x2="780" y2="575" stroke="#9c4221" stroke-width="3"/><line x1="760" y1="445" x2="800" y2="445" stroke="#9c4221" stroke-width="3"/><line x1="760" y1="575" x2="800" y2="575" stroke="#9c4221" stroke-width="3"/>
    <text x="830" y="505" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">Measure and leading</text><text x="830" y="538" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">are compositional tools.</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 05-TYPOGRAPHY-MEASURE</text>
</svg>