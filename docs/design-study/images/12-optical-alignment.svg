<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Optical alignment can differ from geometric alignment</title>
  <desc id="desc">A circle centered mathematically in a box is compared with different-sized title and role text aligned on a perceived baseline.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Optical alignment can differ from geometric alignment</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Curves, capitals, and mixed type sizes often need small visual compensation.</text>
  
    <text x="80" y="160" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">GEOMETRIC</text>
    <rect x="80" y="200" width="430" height="220" rx="14" fill="#ffffff" stroke="none" stroke-width="2"/><line x1="295" y1="220" x2="295" y2="400" stroke="#bcccdc" stroke-width="2" stroke-dasharray="6 6"/><line x1="100" y1="310" x2="490" y2="310" stroke="#bcccdc" stroke-width="2" stroke-dasharray="6 6"/><circle cx="295" cy="310" r="78" fill="#e8eef5" stroke="#9c4221" stroke-width="4"/>
    <text x="295" y="460" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="middle">Measured center</text>
    <text x="650" y="160" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">OPTICAL</text>
    <rect x="650" y="200" width="470" height="220" rx="14" fill="#ffffff" stroke="none" stroke-width="2"/><text x="700" y="320" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="760" text-anchor="start">Shawn</text><text x="905" y="320" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start">Software Engineer</text>
    <line x1="690" y1="324" x2="1080" y2="324" stroke="#2f7d5b" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="885" y="460" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="middle">Different sizes share a perceived baseline</text>
    <rect x="80" y="520" width="1040" height="70" rx="12" fill="#f0f4f8" stroke="none" stroke-width="2"/><text x="600" y="564" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle">Use the grid as a starting point; judge the final relationship with your eyes.</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 12-OPTICAL-ALIGNMENT</text>
</svg>