<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Responsive design preserves relationships, not coordinates</title>
  <desc id="desc">A desktop hero reflows to a mobile stack while preserving the same importance and reading order.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Responsive design preserves relationships, not coordinates</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">The layout may reflow; importance, reading order, and grouping must survive.</text>
  
    <text x="80" y="160" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">DESKTOP</text>
    <rect x="80" y="190" width="650" height="360" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/><text x="120" y="245" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="760" text-anchor="start">Shawn Salat</text><circle cx="155" cy="360" r="55" fill="#e8eef5" stroke="#ffffff" stroke-width="4"/><rect x="250" y="320" width="390" height="8" rx="4" fill="#52606d"/><rect x="250" y="344" width="350" height="8" rx="4" fill="#52606d"/><rect x="250" y="368" width="300" height="8" rx="4" fill="#52606d"/><rect x="250" y="435" width="170" height="52" rx="7" fill="#9c4221" stroke="none" stroke-width="2"/><text x="335" y="468" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="720" text-anchor="middle">Download</text>
    <line x1="760" y1="365" x2="825" y2="365" stroke="#9c4221" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="860" y="160" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">MOBILE</text>
    <rect x="850" y="190" width="270" height="430" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/><text x="880" y="240" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="760" text-anchor="start">Shawn Salat</text><circle cx="920" cy="315" r="40" fill="#e8eef5" stroke="#ffffff" stroke-width="4"/><rect x="880" y="380" width="205" height="8" rx="4" fill="#52606d"/><rect x="880" y="402" width="190" height="8" rx="4" fill="#52606d"/><rect x="880" y="424" width="175" height="8" rx="4" fill="#52606d"/><rect x="880" y="500" width="170" height="52" rx="7" fill="#9c4221" stroke="none" stroke-width="2"/><text x="965" y="533" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="720" text-anchor="middle">Download</text>
    <text x="80" y="605" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start">Invariant: name → portrait + introduction → action</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 14-RESPONSIVE-INVARIANTS</text>
</svg>