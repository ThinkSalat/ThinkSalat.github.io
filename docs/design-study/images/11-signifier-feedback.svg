<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">A control must signal action, mapping, and outcome</title>
  <desc id="desc">An ambiguous music glyph is contrasted with a labeled disclosure control, an arrow showing action, and visible revealed content.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">A control must signal action, mapping, and outcome</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Appearance says “you can act”; feedback says “the action worked.”</text>
  
    <text x="80" y="160" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">AMBIGUOUS</text>
    <text x="170" y="300" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="500" text-anchor="middle">♫</text>
    <text x="170" y="365" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Topic? Button? Status?</text>
    <text x="440" y="160" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">CLEAR INTERACTION CHAIN</text>
    <rect x="440" y="250" width="190" height="66" rx="9" fill="#ffffff" stroke="#9c4221" stroke-width="2"/><text x="535" y="291" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Listening lately ›</text>
    <line x1="650" y1="283" x2="755" y2="283" stroke="#9c4221" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="780" y="215" width="320" height="145" rx="14" fill="#e8eef5" stroke="none" stroke-width="2"/><text x="815" y="260" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="720" text-anchor="start">Listening lately</text><rect x="815" y="292" width="220" height="8" rx="4" fill="#52606d"/><rect x="815" y="316" width="180" height="8" rx="4" fill="#52606d"/>
    <text x="535" y="385" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Signifier</text><text x="940" y="385" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Visible outcome</text>
    <rect x="440" y="470" width="660" height="95" rx="14" fill="#ffffff" stroke="none" stroke-width="2"/><text x="475" y="510" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="760" text-anchor="start">Mapping</text><text x="575" y="510" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="520" text-anchor="start">The label predicts exactly what appears.</text><text x="475" y="545" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="760" text-anchor="start">Feedback</text><text x="575" y="545" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="520" text-anchor="start">The changed state remains perceivable.</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 11-SIGNIFIER-FEEDBACK</text>
</svg>