<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">De-emphasize most things to emphasize one thing</title>
  <desc id="desc">Five equally strong bars are contrasted with a ranked typographic composition containing one primary action.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">De-emphasize most things to emphasize one thing</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">When everything is strong, importance becomes invisible.</text>
  
    <text x="80" y="160" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">UNIFORM EMPHASIS</text>
    <rect x="80" y="195" width="470" height="58" rx="8" fill="#102a43" stroke="none" stroke-width="2"/><text x="110" y="232" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="740" text-anchor="start">Name</text><rect x="80" y="273" width="470" height="58" rx="8" fill="#102a43" stroke="none" stroke-width="2"/><text x="110" y="310" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="740" text-anchor="start">Role</text><rect x="80" y="351" width="470" height="58" rx="8" fill="#102a43" stroke="none" stroke-width="2"/><text x="110" y="388" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="740" text-anchor="start">Summary</text><rect x="80" y="429" width="470" height="58" rx="8" fill="#102a43" stroke="none" stroke-width="2"/><text x="110" y="466" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="740" text-anchor="start">Personal detail</text><rect x="80" y="507" width="470" height="58" rx="8" fill="#102a43" stroke="none" stroke-width="2"/><text x="110" y="544" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="740" text-anchor="start">Download</text>
    <text x="650" y="160" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">RANKED EMPHASIS</text>
    <text x="650" y="238" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="760" text-anchor="start">Shawn Salat</text>
    <text x="650" y="286" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="620" text-anchor="start">Software Engineer</text>
    <rect x="650" y="337" width="390" height="8" rx="4" fill="#52606d"/><rect x="650" y="362" width="340" height="8" rx="4" fill="#52606d"/><rect x="650" y="387" width="300" height="8" rx="4" fill="#52606d"/>
    <text x="650" y="455" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Outside work…</text>
    <rect x="650" y="500" width="210" height="58" rx="8" fill="#9c4221" stroke="none" stroke-width="2"/><text x="755" y="537" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="720" text-anchor="middle">Download resume</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 07-DEEMPHASIS</text>
