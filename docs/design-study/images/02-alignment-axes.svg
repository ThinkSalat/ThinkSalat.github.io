<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Alignment makes relationships visible</title>
  <desc id="desc">A bad composition with three competing vertical axes contrasted with a composition where header, copy, and action share a single alignment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Alignment makes relationships visible</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Every strong left edge is a promise that the elements belong together.</text>
  
    <text x="90" y="160" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">COMPETING AXES</text>
    <line x1="120" y1="190" x2="120" y2="590" stroke="#b42318" stroke-width="2" stroke-dasharray="8 8"/><line x1="260" y1="190" x2="260" y2="590" stroke="#9c4221" stroke-width="2" stroke-dasharray="8 8"/><line x1="390" y1="190" x2="390" y2="590" stroke="#102a43" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="120" y="235" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="750" text-anchor="start">Header</text>
    <circle cx="260" cy="340" r="70" fill="#e8eef5" stroke="#ffffff" stroke-width="5"/>
    <rect x="390" y="285" width="170" height="8" rx="4" fill="#52606d"/><rect x="390" y="311" width="150" height="8" rx="4" fill="#52606d"/><rect x="390" y="337" width="190" height="8" rx="4" fill="#52606d"/><rect x="390" y="363" width="125" height="8" rx="4" fill="#52606d"/>
    <rect x="390" y="440" width="155" height="52" rx="7" fill="#9c4221" stroke="none" stroke-width="2"/><text x="467" y="473" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="720" text-anchor="middle">Action</text>
    <text x="90" y="570" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="560" text-anchor="start">Three unrelated starting points</text>
    <text x="670" y="160" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">SHARED AXIS</text>
    <line x1="730" y1="190" x2="730" y2="590" stroke="#2f7d5b" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="730" y="235" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="750" text-anchor="start">Header</text>
    <text x="730" y="292" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="620" text-anchor="start">Role and introduction</text>
    <rect x="730" y="335" width="360" height="8" rx="4" fill="#52606d"/><rect x="730" y="361" width="330" height="8" rx="4" fill="#52606d"/><rect x="730" y="387" width="285" height="8" rx="4" fill="#52606d"/>
    <rect x="730" y="440" width="155" height="52" rx="7" fill="#9c4221" stroke="none" stroke-width="2"/><text x="807" y="473" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="720" text-anchor="middle">Action</text>
    <circle cx="650" cy="350" r="52" fill="#e8eef5" stroke="#ffffff" stroke-width="4"/>
    <text x="730" y="570" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="560" text-anchor="start">One scan path; the portrait hangs from it</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 02-ALIGNMENT-AXES</text>
</svg>