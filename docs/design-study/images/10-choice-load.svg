<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">More equal choices increase decision work</title>
  <desc id="desc">Eight identical options are contrasted with a primary action, a secondary action, and progressive disclosure for the remainder.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">More equal choices increase decision work</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Reduce visible equality; group, prioritize, or progressively disclose secondary options.</text>
  
    <text x="80" y="160" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">EIGHT EQUAL CHOICES</text>
    <rect x="80" y="195" width="180" height="54" rx="8" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/><text x="170" y="229" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Option 1</text><rect x="280" y="195" width="180" height="54" rx="8" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/><text x="370" y="229" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Option 2</text><rect x="80" y="270" width="180" height="54" rx="8" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/><text x="170" y="304" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Option 3</text><rect x="280" y="270" width="180" height="54" rx="8" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/><text x="370" y="304" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Option 4</text><rect x="80" y="345" width="180" height="54" rx="8" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/><text x="170" y="379" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Option 5</text><rect x="280" y="345" width="180" height="54" rx="8" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/><text x="370" y="379" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Option 6</text><rect x="80" y="420" width="180" height="54" rx="8" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/><text x="170" y="454" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Option 7</text><rect x="280" y="420" width="180" height="54" rx="8" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/><text x="370" y="454" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Option 8</text>
    <text x="650" y="160" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">PRIORITIZED PATH</text>
    <rect x="650" y="200" width="285" height="66" rx="9" fill="#9c4221" stroke="none" stroke-width="2"/><text x="792" y="241" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="720" text-anchor="middle">Download resume</text>
    <rect x="650" y="290" width="210" height="56" rx="8" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/><text x="755" y="326" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="680" text-anchor="middle">Email me</text>
    <text x="650" y="405" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">More formats  ›</text>
    <text x="650" y="470" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">One primary, one secondary,</text>
    <text x="650" y="500" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">the rest available on demand.</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 10-CHOICE-LOAD</text>
</svg>