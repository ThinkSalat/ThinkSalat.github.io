<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchy is a ranking, not a collection of boxes</title>
  <desc id="desc">A comparison between a bordered interface where every element has equal emphasis and a clean hierarchy using varied typography, contrast, and spacing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Hierarchy is a ranking, not a collection of boxes</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Size, weight, contrast, and space can establish order before borders do.</text>
  
    <text x="80" y="160" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">EVERYTHING SHOUTS</text>
    <rect x="80" y="185" width="470" height="400" rx="14" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/>
    <rect x="110" y="220" width="410" height="68" rx="8" fill="#f0f4f8" stroke="#bcccdc" stroke-width="2"/><text x="132" y="264" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="760" text-anchor="start">SHAWN SALAT</text>
    <rect x="110" y="310" width="410" height="68" rx="8" fill="#f0f4f8" stroke="#bcccdc" stroke-width="2"/><text x="132" y="354" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="760" text-anchor="start">SOFTWARE ENGINEER</text>
    <rect x="110" y="400" width="410" height="68" rx="8" fill="#f0f4f8" stroke="#bcccdc" stroke-width="2"/><text x="132" y="444" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="760" text-anchor="start">INTRODUCTION</text>
    <rect x="110" y="490" width="410" height="68" rx="8" fill="#fde5d8" stroke="#9c4221" stroke-width="2"/><text x="315" y="534" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="760" text-anchor="middle">ACTION</text>
    <text x="650" y="160" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">ONE CLEAR PATH</text>
    <text x="650" y="250" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="760" text-anchor="start">Shawn Salat</text>
    <text x="650" y="292" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="620" text-anchor="start">Software Engineer</text>
    <rect x="650" y="345" width="410" height="9" rx="4.5" fill="#52606d"/><rect x="650" y="370" width="380" height="9" rx="4.5" fill="#52606d"/><rect x="650" y="395" width="330" height="9" rx="4.5" fill="#52606d"/>
    <rect x="650" y="455" width="215" height="58" rx="8" fill="#9c4221" stroke="none" stroke-width="2"/><text x="757" y="492" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="720" text-anchor="middle">Download resume</text>
    <text x="650" y="552" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="560" text-anchor="start">The eye can explain the order instantly.</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 01-HIERARCHY-SIGNALS</text>
</svg>