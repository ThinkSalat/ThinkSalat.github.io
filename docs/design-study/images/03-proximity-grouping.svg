<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Proximity should answer “what belongs together?”</title>
  <desc id="desc">Two content cards show how equal gaps create ambiguity while smaller internal gaps and larger group gaps clarify relationships.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Proximity should answer “what belongs together?”</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Internal gaps stay smaller than gaps between groups.</text>
  
    <text x="80" y="160" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">AMBIGUOUS</text>
    <rect x="80" y="190" width="480" height="390" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/>
    <text x="120" y="245" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="720" text-anchor="start">Heading</text><rect x="120" y="275" width="350" height="8" rx="4" fill="#52606d"/>
    <text x="120" y="360" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="620" text-anchor="start">Supporting detail</text><rect x="120" y="392" width="330" height="8" rx="4" fill="#52606d"/>
    <rect x="120" y="480" width="165" height="52" rx="7" fill="#9c4221" stroke="none" stroke-width="2"/><text x="202" y="513" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="720" text-anchor="middle">Continue</text>
    <text x="325" y="510" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="start">Every gap = 60</text>
    <text x="650" y="160" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">GROUPED</text>
    <rect x="650" y="190" width="470" height="390" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/>
    <text x="690" y="245" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="720" text-anchor="start">Heading</text><rect x="690" y="275" width="350" height="8" rx="4" fill="#52606d"/>
    <line x1="1070" y1="245" x2="1070" y2="296" stroke="#2f7d5b" stroke-width="3"/><text x="1055" y="326" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">16</text>
    <text x="690" y="375" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="620" text-anchor="start">Supporting detail</text><rect x="690" y="407" width="330" height="8" rx="4" fill="#52606d"/>
    <line x1="1070" y1="296" x2="1070" y2="375" stroke="#9c4221" stroke-width="3"/><text x="1055" y="360" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">48</text>
    <rect x="690" y="482" width="165" height="52" rx="7" fill="#9c4221" stroke="none" stroke-width="2"/><text x="772" y="515" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="720" text-anchor="middle">Continue</text>
    <text x="690" y="560" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="560" text-anchor="start">Small inside; large between</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 03-PROXIMITY-GROUPING</text>
</svg>