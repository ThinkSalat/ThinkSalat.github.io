<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">People perceive groups before individual parts</title>
  <desc id="desc">Three diagrams illustrate grouping through proximity, similarity, and a shared enclosing region.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">People perceive groups before individual parts</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Proximity, similarity, and common region create grouping automatically.</text>
  
    <text x="80" y="165" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">PROXIMITY</text>
    <circle cx="115" cy="235" r="15" fill="#9c4221" stroke="none" stroke-width="2"/><circle cx="157" cy="235" r="15" fill="#9c4221" stroke="none" stroke-width="2"/><circle cx="199" cy="235" r="15" fill="#9c4221" stroke="none" stroke-width="2"/><circle cx="315" cy="235" r="15" fill="#102a43" stroke="none" stroke-width="2"/><circle cx="357" cy="235" r="15" fill="#102a43" stroke="none" stroke-width="2"/><circle cx="399" cy="235" r="15" fill="#102a43" stroke="none" stroke-width="2"/>
    <text x="80" y="295" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Two groups appear without labels.</text>
    <text x="450" y="165" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">SIMILARITY</text>
    <circle cx="480" cy="220" r="16" fill="#102a43" stroke="none" stroke-width="2"/><circle cx="535" cy="220" r="16" fill="#9c4221" stroke="none" stroke-width="2"/><circle cx="590" cy="220" r="16" fill="#102a43" stroke="none" stroke-width="2"/><circle cx="480" cy="275" r="16" fill="#9c4221" stroke="none" stroke-width="2"/><circle cx="535" cy="275" r="16" fill="#102a43" stroke="none" stroke-width="2"/><circle cx="590" cy="275" r="16" fill="#9c4221" stroke="none" stroke-width="2"/>
    <text x="450" y="330" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Shared appearance implies shared role.</text>
    <text x="820" y="165" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">COMMON REGION</text>
    <rect x="820" y="195" width="290" height="125" rx="20" fill="#e8eef5" stroke="none" stroke-width="2"/><circle cx="875" cy="257" r="18" fill="#9c4221" stroke="none" stroke-width="2"/><circle cx="935" cy="257" r="18" fill="#9c4221" stroke="none" stroke-width="2"/><circle cx="995" cy="257" r="18" fill="#9c4221" stroke="none" stroke-width="2"/>
    <text x="820" y="350" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">A surface is a powerful grouping cue.</text>
    <rect x="80" y="410" width="1030" height="155" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/>
    <text x="120" y="462" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="720" text-anchor="start">Design implication</text>
    <text x="120" y="505" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">A card, shared color, or tight spacing all assert a relationship.</text>
    <text x="120" y="538" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="start">Do not assert three conflicting relationships at the same time.</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 08-GESTALT-GROUPING</text>
</svg>