<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Forensics: why the candidate-20 screenshot feels wrong</title>
  <desc id="desc">A simplified version of the rejected hero is annotated with three vertical axes and four identified composition problems.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Forensics: why the candidate-20 screenshot feels wrong</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">The design asserts several different organizing systems and leaves the handoff unresolved.</text>
  
    <text x="80" y="155" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">SIMPLIFIED SCREENSHOT</text>
    <text x="100" y="235" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="760" text-anchor="start">Shawn Salat</text><text x="425" y="235" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">—  Software Engineer</text>
    <rect x="100" y="285" width="860" height="210" rx="36" fill="#e8eef5" stroke="none" stroke-width="2"/><circle cx="210" cy="390" r="70" fill="#ffffff" stroke="#ffffff" stroke-width="5"/><rect x="360" y="345" width="500" height="8" rx="4" fill="#52606d"/><rect x="360" y="369" width="460" height="8" rx="4" fill="#52606d"/><rect x="360" y="393" width="410" height="8" rx="4" fill="#52606d"/><rect x="360" y="417" width="520" height="8" rx="4" fill="#52606d"/><rect x="360" y="441" width="350" height="8" rx="4" fill="#52606d"/>
    <rect x="360" y="525" width="190" height="54" rx="7" fill="#9c4221" stroke="none" stroke-width="2"/><text x="455" y="559" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="720" text-anchor="middle">Download resume</text><rect x="570" y="525" width="130" height="54" rx="7" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/><text x="635" y="559" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Email</text>
    <line x1="100" y1="180" x2="100" y2="620" stroke="#b42318" stroke-width="2" stroke-dasharray="7 7"/><line x1="360" y1="300" x2="360" y2="620" stroke="#9c4221" stroke-width="2" stroke-dasharray="7 7"/><line x1="210" y1="300" x2="210" y2="500" stroke="#102a43" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="100" y="645" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">container/header</text><text x="360" y="645" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">copy/action</text><text x="210" y="615" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">portrait center</text>
    <circle cx="940" cy="303" r="22" fill="#b42318" stroke="none" stroke-width="2"/><text x="940" y="311" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="760" text-anchor="middle">1</text><text x="975" y="309" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">Competing axes</text>
    <circle cx="940" cy="375" r="22" fill="#b42318" stroke="none" stroke-width="2"/><text x="940" y="383" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="760" text-anchor="middle">2</text><text x="975" y="381" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">CTA leaves the field</text>
    <circle cx="940" cy="447" r="22" fill="#b42318" stroke="none" stroke-width="2"/><text x="940" y="455" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="760" text-anchor="middle">3</text><text x="975" y="453" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">Roundness overgroups</text>
    <circle cx="940" cy="519" r="22" fill="#b42318" stroke="none" stroke-width="2"/><text x="940" y="527" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="760" text-anchor="middle">4</text><text x="975" y="525" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">Dead space breaks rhythm</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 15-HERO-FORENSICS</text>
