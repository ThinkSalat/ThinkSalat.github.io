<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Use a spacing scale, then make semantic choices</title>
  <desc id="desc">Random spacing values are contrasted with a limited token scale used for different semantic relationships.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Use a spacing scale, then make semantic choices</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Consistency creates rhythm; meaning decides which step to use.</text>
  
    <text x="80" y="165" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">RANDOM VALUES</text>
    <rect x="100" y="210" width="240" height="28" rx="5" fill="#e8eef5" stroke="none" stroke-width="2"/><text x="465" y="232" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="start">17px</text><rect x="100" y="282" width="260" height="28" rx="5" fill="#e8eef5" stroke="none" stroke-width="2"/><text x="465" y="304" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="start">29px</text><rect x="100" y="354" width="280" height="28" rx="5" fill="#e8eef5" stroke="none" stroke-width="2"/><text x="465" y="376" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="start">43px</text><rect x="100" y="426" width="300" height="28" rx="5" fill="#e8eef5" stroke="none" stroke-width="2"/><text x="465" y="448" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="start">22px</text><rect x="100" y="498" width="320" height="28" rx="5" fill="#e8eef5" stroke="none" stroke-width="2"/><text x="465" y="520" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="start">61px</text>
    <text x="650" y="165" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">TOKEN SCALE</text>
    <rect x="680" y="205" width="22" height="24" rx="4" fill="#e8eef5" stroke="none" stroke-width="2"/><text x="1045" y="224" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">4</text><rect x="680" y="258" width="44" height="24" rx="4" fill="#e8eef5" stroke="none" stroke-width="2"/><text x="1045" y="277" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">8</text><rect x="680" y="311" width="88" height="24" rx="4" fill="#e8eef5" stroke="none" stroke-width="2"/><text x="1045" y="330" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">16</text><rect x="680" y="364" width="132" height="24" rx="4" fill="#fde5d8" stroke="none" stroke-width="2"/><text x="1045" y="383" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">24</text><rect x="680" y="417" width="176" height="24" rx="4" fill="#fde5d8" stroke="none" stroke-width="2"/><text x="1045" y="436" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">32</text><rect x="680" y="470" width="264" height="24" rx="4" fill="#fde5d8" stroke="none" stroke-width="2"/><text x="1045" y="489" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">48</text><rect x="680" y="523" width="352" height="24" rx="4" fill="#fde5d8" stroke="none" stroke-width="2"/><text x="1045" y="542" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">64</text>
    <text x="680" y="605" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="560" text-anchor="start">Choose 8 for tight pairs, 24 for groups, 48 for sections.</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 04-SPACING-RHYTHM</text>
</svg>