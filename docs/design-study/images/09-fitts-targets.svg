<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Target acquisition trades distance against size</title>
  <desc id="desc">A pointer moving to a small distant target is contrasted with a nearby large primary action.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Target acquisition trades distance against size</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Frequent or important actions should be easier to reach and easier to hit.</text>
  
    <text x="80" y="160" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">HARDER</text>
    <circle cx="135" cy="360" r="18" fill="#102a43" stroke="none" stroke-width="2"/><text x="135" y="405" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Pointer</text>
    <line x1="160" y1="350" x2="505" y2="230" stroke="#9c4221" stroke-width="4"/><line x1="160" y1="350" x2="505" y2="230" stroke="#9c4221" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="520" y="200" width="42" height="42" rx="6" fill="#9c4221" stroke="none" stroke-width="2"/><text x="541" y="270" fill="#b42318" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Small + far</text>
    <text x="650" y="160" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start">EASIER</text>
    <circle cx="705" cy="360" r="18" fill="#102a43" stroke="none" stroke-width="2"/><text x="705" y="405" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Pointer</text>
    <line x1="730" y1="350" x2="855" y2="310" stroke="#9c4221" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="870" y="260" width="190" height="92" rx="12" fill="#9c4221" stroke="none" stroke-width="2"/><text x="965" y="316" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="720" text-anchor="middle">Primary action</text>
    <text x="965" y="390" fill="#2f7d5b" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Large + nearby</text>
    <rect x="80" y="500" width="1030" height="85" rx="14" fill="#f0f4f8" stroke="none" stroke-width="2"/><text x="595" y="552" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="680" text-anchor="middle">Visual prominence and physical usability should agree.</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 09-FITTS-TARGETS</text>
</svg>