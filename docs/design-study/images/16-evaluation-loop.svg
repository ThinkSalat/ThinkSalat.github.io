<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Advanced design is disciplined evaluation</title>
  <desc id="desc">A four-stage design evaluation loop moves from ranking and composition to real-browser observation and evidence-based iteration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9c4221"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="66" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="760" text-anchor="start">Advanced design is disciplined evaluation</text>
  <text x="60" y="102" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Compose a hypothesis, compare it, observe it in context, and keep only evidence-backed improvements.</text>
  
    <rect x="80" y="215" width="210" height="110" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/><text x="185" y="258" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="760" text-anchor="middle">1 · RANK</text><text x="185" y="292" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="550" text-anchor="middle">What matters first?</text>
    <line x1="310" y1="270" x2="390" y2="270" stroke="#9c4221" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="410" y="215" width="210" height="110" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/><text x="515" y="258" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="760" text-anchor="middle">2 · COMPOSE</text><text x="515" y="292" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="550" text-anchor="middle">Choose one hypothesis.</text>
    <line x1="640" y1="270" x2="720" y2="270" stroke="#9c4221" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="740" y="215" width="210" height="110" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/><text x="845" y="258" fill="#9c4221" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="760" text-anchor="middle">3 · OBSERVE</text><text x="845" y="292" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="550" text-anchor="middle">Use a real browser.</text>
    <path d="M950 270 C1090 270 1090 450 845 450 C600 450 380 450 185 450 C90 450 80 380 150 340" fill="none" stroke="#9c4221" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
    <rect x="270" y="500" width="660" height="105" rx="16" fill="#e8eef5" stroke="none" stroke-width="2"/>
    <text x="320" y="540" fill="#102a43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="760" text-anchor="start">Keep only if:</text><text x="470" y="540" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">hierarchy reads instantly</text><text x="710" y="540" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">groups are unambiguous</text>
    <text x="320" y="575" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">reading order survives</text><text x="565" y="575" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">actions are discoverable</text><text x="790" y="575" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">rhythm reaches the next section</text>
  
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#bcccdc" stroke-width="1"/>
  <text x="60" y="700" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">DESIGN STUDY · 16-EVALUATION-LOOP</text>
</svg>